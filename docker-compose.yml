# Container-specific overrides. Everything else (secrets, retry policy, request
# limits, PORT, ...) is loaded from .env via `env_file` below. Values listed
# under `environment` take precedence over `env_file`.
x-app-environment: &app-environment
  # Inside Compose, PostgreSQL and Redis are reachable by service name. The
  # DATABASE_URL in .env targets localhost for Prisma commands run on the host.
  DATABASE_URL: postgresql://${DATABASE_USER:-webhook_service_user}:${DATABASE_PASSWORD:-webhook_service_password}@postgres:5432/${DATABASE_NAME:-webhook_service_database}?schema=public
  REDIS_URL: redis://redis:6379
  NODE_ENV: production

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${DATABASE_USER:-webhook_service_user}
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD:-webhook_service_password}
      POSTGRES_DB: ${DATABASE_NAME:-webhook_service_database}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          'pg_isready -U "$${DATABASE_USER}" -d "$${DATABASE_NAME}"',
        ]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    env_file:
      - .env
    environment:
      <<: *app-environment
    ports:
      - "${PORT:-5000}:${PORT:-5000}"
    restart: unless-stopped
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:' + (process.env.PORT ?? 5000) + '/v1/health').then((response) => process.exit(response.ok ? 0 : 1)).catch(() => process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  worker:
    build:
      context: .
      dockerfile: Dockerfile
    command: ["node", "dist/worker.js"]
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    env_file:
      - .env
    environment:
      <<: *app-environment
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:
